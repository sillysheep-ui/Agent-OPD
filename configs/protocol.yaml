protocol_version: omniopd-v1
environment:
  max_steps: 50
student:
  state_pool_seed: 42
  temperature: 0.0
  max_tokens: 256
  fallback_action: look
  allow_unique_prefix: false
teacher:
  sampling_profile: teacher_sampling_nonthinking.yaml
  thinking_mode: disabled
  temperature: 1.0
  reasoning_effort: null
  max_tokens: 256
  samples_per_state: 1
  # Every API call, including invalid output, consumes this budget.
  maximum_calls: 150
selection:
  policy: uniform_per_game_nested_v1
  seed: 42
  states_per_game: 3
training:
  target: action_only
  weighting: game_state_mean
  include_teacher_reasoning: false
  model_load_dtype: fp32
  compute_dtype: bf16
  reduction_dtype: fp32
  global_batch_size: 4
  seeds: [7, 42, 123, 2024]
  data_split_seed: 42
  total_optimizer_steps: 102
  learning_rate: 2.0e-5
  nominal_dataset_passes: 3
evaluation:
  temperature: 0.0
  rollout_seed: 2026
  paired_games: true
  bootstrap_replicates: 50000
  bootstrap_seed: 42
  resample_seeds: true
