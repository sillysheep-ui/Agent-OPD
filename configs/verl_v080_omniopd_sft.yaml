# This is an OmniOPD-owned configuration for integrations/verl/fsdp_sft_trainer.py.
# veRL v0.8.0 no longer ships the legacy fsdp_sft_trainer.yaml schema. Do not
# pass this file to veRL's upstream SFT or PPO/OPD entry points.
data:
  train_batch_size: 4
  micro_batch_size_per_gpu: 1
  train_files: null
  val_files: null
  max_length: 4096
  truncation: error
  chat_template: null
  # Student system prompt version; see omniopd.prompts.  Declared here so
  # a prompt ablation overrides an existing key instead of appending one.
  student_prompt: v1
  num_workers: 0
model:
  partial_pretrain: null
  fsdp_config:
    model_dtype: fp32
    wrap_policy:
      min_num_params: 0
    cpu_offload: false
    offload_params: false
  external_lib: null
  enable_gradient_checkpointing: true
  trust_remote_code: false
  lora_rank: 16
  lora_alpha: 32
  target_modules: all-linear
  use_liger: false
  strategy: fsdp
optim:
  lr: 2.0e-5
  betas: [0.9, 0.95]
  weight_decay: 0.01
  warmup_steps_ratio: 0.1
  clip_grad: 1.0
  lr_scheduler: cosine
ulysses_sequence_parallel_size: 1
use_remove_padding: false
trainer:
  default_local_dir: null
  default_hdfs_dir: null
  project_name: agent_omniopd
  experiment_name: audited_sft
  total_epochs: 1
  total_training_steps: null
  logger: [console]
  seed: 1
  save_freq: 0
  test_freq: 0
